[pytest]
testpaths = tests
# 既定では結合検査(実際に学習を回すもの)を外す。**skip は緑ではない**ので、
# 出荷前には `pytest -q -m "integration"` を別に走らせること。
# 理由は速さ: 中断と再開の検査は学習を 4 回起動するので、共有機では数分かかる
addopts = -m "not integration"
markers =
    unit: 外部データを要さない単体検査
    integration: 生成物(shard 等)を要する結合検査
    validation: 品質ゲート G-xx を判定する検査
filterwarnings =
    ignore::DeprecationWarning
